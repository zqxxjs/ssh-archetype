#set( $symbol_pound = '#' )
#set( $symbol_dollar = '$' )
#set( $symbol_escape = '\' )
${symbol_pound} ============================================================
${symbol_pound} Hibernate (SQL Server)
${symbol_pound} ============================================================
hibernate.show_sql=true
hibernate.format_sql=true
hibernate.use_sql_comments=true
${symbol_pound} /api/hibernate 通过 Statistics 验证二级缓存命中
hibernate.generate_statistics=true

${symbol_pound} 脚手架使用 update；生产环境建议改为 validate 或 none，并使用迁移工具
hibernate.hbm2ddl.auto=update
hibernate.jdbc.time_zone=Asia/Shanghai

${symbol_pound} 二级缓存：由 Redisson 提供
hibernate.cache.use_second_level_cache=true
hibernate.cache.use_query_cache=false
${symbol_pound} 与 mariadb/pgsql 的缓存区域隔离，避免切换数据源后读到旧库缓存
hibernate.cache.region_prefix=sqlserver
hibernate.cache.region.factory_class=org.redisson.hibernate.RedissonRegionFactory
${symbol_pound} 该路径由 RedissonRegionFactory 通过 classpath 加载
hibernate.cache.redisson.config=props/redisson.yaml
${symbol_pound} false 表示缓存异常直接抛出，便于发现配置问题；生产可改为 true 降级
hibernate.cache.redisson.fallback=false

hibernate.order_inserts=true
hibernate.order_updates=true
