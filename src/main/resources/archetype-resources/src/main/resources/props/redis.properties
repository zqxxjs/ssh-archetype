${symbol_pound} ============================================================
${symbol_pound} Spring Session 配置
${symbol_pound} Redisson 的连接参数统一在 props/redisson.yaml 中配置，
${symbol_pound} Hibernate 二级缓存和 Spring Session 共用该 Redis 实例。
${symbol_pound} ============================================================
${symbol_pound} Session 过期时间，ISO-8601：PT30M = 30 分钟
spring.session.timeout=PT30M
${symbol_pound} Redis key 前缀
spring.session.namespace=${artifactId}:session
${symbol_pound} 浏览器 Cookie 名称
spring.session.cookie-name=SESSION
${symbol_pound} 本地 HTTP 开发环境为 false；生产 HTTPS 请改为 true
spring.session.cookie-secure=false
${symbol_pound} Lax / Strict / None
spring.session.cookie-same-site=Lax
